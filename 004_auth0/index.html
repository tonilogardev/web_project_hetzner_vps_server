<!DOCTYPE html>
<html class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>tonilogar web</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" type="text/css" href="/css/main.css" />
    <link
      rel="stylesheet"
      href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.6/styles/monokai-sublime.min.css"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.7.2/css/solid.css"
      integrity="sha384-r/k8YTFqmlOaqRkZuSiE9trsrDXkh07mRaoGBMoDcmA58OHILZPsk29i2BsFng1B"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.7.2/css/fontawesome.css"
      integrity="sha384-4aon80D8rXCGx9ayDt85LbyUHeMWd3UiBaWliBlJ53yzm9hqN21A+o1pqoyK04h+"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.auth0.com/js/auth0-samples-theme/1.0/css/auth0-theme.min.css"
    />
    <link rel="shortcut icon" href="/images/logo.png" type="image/x-icon">
  </head>

  <body class="h-100">
    <div id="app" class="h-100 d-flex flex-column">
      <div class="nav-container">
        <nav class="navbar navbar-expand-md navbar-light bg-light">
          <div class="container-fluid px-3">
            <!-- <div class="navbar-brand logo"></div> -->
            <button
              class="navbar-toggler"
              type="button"
              data-toggle="collapse"
              data-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
              <!-- <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                  <a href="/" class="nav-link route-link">Home</a>
                </li>
              </ul> -->
              <ul class="navbar-nav ml-auto d-none d-md-block">
                <!-- Login button: show if NOT authenticated -->
                <li class="nav-item auth-invisible">
                  <button
                    id="qsLoginBtn"
                    onclick="login()"
                    class="btn btn-primary btn-margin auth-invisible hidden"
                  >
                    Log in
                  </button>
                </li>
                <!-- / Login button -->

                <!-- Fullsize dropdown: show if authenticated -->
                <li class="nav-item dropdown auth-visible hidden">
                  <a
                    class="nav-link dropdown-toggle"
                    href="#"
                    id="profileDropDown"
                    data-toggle="dropdown"
                  >
                    <!-- Profile image should be set to the profile picture from the id token -->
                    <img
                      alt="Profile picture"
                      class="nav-user-profile profile-image rounded-circle"
                      width="50"
                    />
                  </a>
                  <div class="dropdown-menu dropdown-menu-right">
                    <!-- Show the user's full name from the id token here -->
                    <div class="dropdown-header nav-user-name user-name"></div>
                    <a
                      href="/profile"
                      class="dropdown-item dropdown-profile route-link"
                    >
                      <i class="fas fa-user mr-3"></i> Profile
                    </a>
                    <a
                      href="#"
                      class="dropdown-item"
                      id="qsLogoutBtn"
                      onclick="logout()"
                    >
                      <i class="fas fa-power-off mr-3"></i> Log out
                    </a>
                  </div>
                </li>
                <!-- /Fullsize dropdown -->
              </ul>

              <!-- Responsive login button: show if NOT authenticated -->
              <ul class="navbar-nav d-md-none auth-invisible w-100">
                <li class="nav-item w-100">
                  <button
                    class="btn btn-primary btn-block auth-invisible hidden mt-2"
                    id="qsLoginBtn"
                    onclick="login()"
                  >
                    Log in
                  </button>
                </li>
              </ul>
              <!-- /Responsive login button -->

              <!-- Responsive profile dropdown: show if authenticated -->
              <ul
                class="
                  navbar-nav
                  d-md-none
                  auth-visible
                  hidden
                  w-100
                  mt-2
                "
              >
                <li class="nav-item text-center mb-3">
                  <div class="user-info d-flex align-items-center justify-content-center">
                    <!-- Profile image should be set to the profile picture from the id token -->
                    <img
                      alt="Profile picture"
                      class="
                        nav-user-profile
                        profile-image
                        rounded-circle
                        mr-3
                      "
                      width="40"
                    />
                    <!-- Show the user's full name from the id token here -->
                    <h6 class="nav-user-name user-name mb-0"></h6>
                  </div>
                </li>
                <li class="nav-item">
                  <a href="/profile" class="nav-link route-link text-center">
                    <i class="fas fa-user mr-2"></i>Profile
                  </a>
                </li>
                <li class="nav-item">
                  <a href="#" class="nav-link text-center" id="qsLogoutBtn" onclick="logout()">
                    <i class="fas fa-power-off mr-2"></i>Log out
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>

      <div id="main-content" class="container-fluid px-3 px-md-5 mt-3 mt-md-5 flex-grow-1">
        <div id="content-home" class="page text-center">
          <div class="welcome-section">
            <div class="welcome-icon mb-3 mb-md-4">
              <img src="images/logo.gif" alt="tonilogar logo" class="logo img-fluid" style="max-width: 150px;" />
            </div>
            <h3 class="mb-3 mb-md-4"><strong>Welcome firstmain_dev_pro</strong></h3>
            <div class="row justify-content-center">
              <div class="col-12 col-md-10 col-lg-8">
                <p class="lead mb-3 mb-md-4">
                  Explore freely, tools developed with DevOps best practices,
                  frontend and backend architecture, along with experience in 3D virtual environments,
                  artificial intelligence, GIS, BIM and satellite imagery.
                </p>
              </div>
            </div>
            <div class="call-to-action">
              <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                  <button
                    class="btn btn-success btn-lg btn-block auth-invisible hidden"
                    onclick="login()"
                    style="border-radius: 10px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); box-shadow: 4px 4px 8px rgba(0,0,0,0.3); transition: all 0.3s ease;"
                    onmouseover="this.style.boxShadow='6px 6px 12px rgba(0,0,0,0.4)'; this.style.transform='translateY(-1px)';"
                    onmouseout="this.style.boxShadow='4px 4px 8px rgba(0,0,0,0.3)'; this.style.transform='translateY(0px)';"
                  >
                    <i class="fas fa-user-plus mr-2"></i>
                    Go ahead, create your user and start exploring!
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="page" id="content-profile">
          <div class="container-fluid">
            <div class="row align-items-center profile-header mb-4 mb-md-5">
              <div class="col-12 col-md-3 col-lg-2 text-center text-md-left mb-3 mb-md-0">
                <img
                  alt="User's profile picture"
                  class="rounded-circle img-fluid profile-image"
                  style="max-width: 120px;"
                />
              </div>
              <div class="col-12 col-md-9 col-lg-10 text-center text-md-left">
                <h2 class="user-name mb-2"></h2>
                <p class="lead text-muted user-email mb-0"></p>
              </div>
            </div>

            <div class="row justify-content-center">
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <pre class="rounded mb-0" style="max-height: 400px; overflow-y: auto;">
                      <code id="profile-data" class="json"></code>
                    </pre>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="bg-light text-center p-3 p-md-5 mt-4 mt-md-5">
        <img src="images/logo.gif" alt="tonilogar logo" class="logo img-fluid" style="max-width: 100px;" />
      </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.6/highlight.min.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
