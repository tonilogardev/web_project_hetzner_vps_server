services:
  hello-world:
    build:
      context: ./004_test_container_dev_pro
      args:
        APP_PORT: ${PORT_004_TEST_CONTAINER_DEV_PRO:-3000}
    container_name: hello_world_app
    restart: unless-stopped
    environment:
      NODE_ENV: ${ENVIRONMENT:-development}
      PORT: ${PORT_004_TEST_CONTAINER_DEV_PRO:-3000}
      COMMAND: ${COMMAND:-start}
      BASE_URL: ${BASE_URL:-http://localhost:}
    ports:
      - "${PORT_004_TEST_CONTAINER_DEV_PRO:-3000}:${PORT_004_TEST_CONTAINER_DEV_PRO:-3000}"
    volumes:
      - "${DEV_CODE_VOLUME_HOST:-./004_test_container_dev_pro}:${DEV_CODE_VOLUME_CONTAINER:-/app}"
      - "${NODE_MODULES_VOLUME_HOST:-004_test_container_dev_pro_node_modules}:${NODE_MODULES_VOLUME_CONTAINER:-/app/node_modules}"

  nginx-reverse-proxy:
    build:
      context: ./005_nginx_reverse_proxy
    container_name: nginx_reverse_proxy
    depends_on:
      - hello-world
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TARGET_SERVICE_HOST: hello-world
      TARGET_SERVICE_PORT: ${PORT_004_TEST_CONTAINER_DEV_PRO:-3000}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      NGINX_DNS_RESOLVERS: ${NGINX_DNS_RESOLVERS:-8.8.8.8 8.8.4.4}
      NGINX_DNS_RESOLVER_TIMEOUT: ${NGINX_DNS_RESOLVER_TIMEOUT:-5s}
      NGINX_DNS_RESOLVER_VALID: ${NGINX_DNS_RESOLVER_VALID:-300s}
      NGINX_SSL_PROTOCOLS: ${NGINX_SSL_PROTOCOLS:-TLSv1.2 TLSv1.3}
      NGINX_SSL_CIPHERS: ${NGINX_SSL_CIPHERS:-ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384}
      NGINX_SSL_SESSION_TIMEOUT: ${NGINX_SSL_SESSION_TIMEOUT:-1d}
      NGINX_SSL_SESSION_CACHE: ${NGINX_SSL_SESSION_CACHE:-shared:SSL:10m}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - "${NGINX_CERTS_HOST:-./005_nginx_reverse_proxy/certbot/certs}:${NGINX_CERTS_CONTAINER:-/etc/letsencrypt}"
      - "${NGINX_STATIC_HOST:-./005_nginx_reverse_proxy/certbot/www}:${NGINX_STATIC_CONTAINER:-/var/www/certbot}"
volumes:
  004_test_container_dev_pro_node_modules:
