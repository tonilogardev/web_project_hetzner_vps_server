services:
  backend_auth0:
    build:
      context: ./004_auth0
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${ENVIRONMENT:-development}
    container_name: backend_auth0
    env_file:
      - .env.${ENVIRONMENT:-development}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COMMAND: ${COMMAND:-start}
      PORT: ${PORT_004_AUTH_0:-3000}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:}
    command: npm run ${COMMAND:-start}
    ports:
      - "${PORT_004_AUTH_0:-3000}:${PORT_004_AUTH_0:-3000}"
    restart: unless-stopped
    volumes:
      - "${BACKEND_CODE_VOLUME_HOST:-./004_auth0}:${BACKEND_CODE_VOLUME_CONTAINER:-/app}"
      - "${BACKEND_NODE_MODULES_VOLUME_HOST:-004_auth0_node_modules}:${BACKEND_NODE_MODULES_VOLUME_CONTAINER:-/app/node_modules}"

  nginx_reverse_proxy:
    build:
      context: ./006_nginx_reverse_proxy
    container_name: nginx_reverse_proxy
    depends_on:
      - backend_auth0
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BACKEND_SERVICE_NAME: backend_auth0
      PORT_BACKEND_AUTH0: ${PORT_004_AUTH_0:-3000}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:-80}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      VOL_CERTBOT_CONTAINER: ${NGINX_STATIC_CONTAINER:-/var/www/certbot}
      VOL_LETSENCRYPT_CONTAINER: ${NGINX_CERTS_CONTAINER:-/etc/letsencrypt}
      NGINX_SSL_PROTOCOLS: ${NGINX_SSL_PROTOCOLS:-TLSv1.2 TLSv1.3}
      NGINX_SSL_CIPHERS: ${NGINX_SSL_CIPHERS:-ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384}
      NGINX_SSL_SESSION_TIMEOUT: ${NGINX_SSL_SESSION_TIMEOUT:-1d}
      NGINX_SSL_SESSION_CACHE: ${NGINX_SSL_SESSION_CACHE:-shared:SSL:10m}
      NGINX_DNS_RESOLVERS: ${NGINX_DNS_RESOLVERS:-8.8.8.8 8.8.4.4}
      NGINX_DNS_RESOLVER_TIMEOUT: ${NGINX_DNS_RESOLVER_TIMEOUT:-5s}
      NGINX_DNS_RESOLVER_VALID: ${NGINX_DNS_RESOLVER_VALID:-300s}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - "${NGINX_CERTS_HOST:-./006_nginx_reverse_proxy/certbot/certs}:${NGINX_CERTS_CONTAINER:-/etc/letsencrypt}"
      - "${NGINX_STATIC_HOST:-./006_nginx_reverse_proxy/certbot/www}:${NGINX_STATIC_CONTAINER:-/var/www/certbot}"

volumes:
  004_auth0_node_modules:
